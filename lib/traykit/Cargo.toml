[package]
name = "traykit"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
description = "Building blocks for small Windows tray apps: tray icon and menu, glass popup, dialogs, autostart."
include = ["src/**/*", "examples/**/*", "README.md", "LICENSE"]
license = "MIT"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/traykit"
keywords = ["windows", "win32", "tray", "popup", "acrylic"]
categories = ["gui", "os::windows-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[dependencies]
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
