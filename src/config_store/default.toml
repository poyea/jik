# jik configuration.
# All settings are optional. If you remove a line, jik uses the default value.

[popup]
# The position of the popup on the primary monitor. The popup does not cover the taskbar.
# Use one of these values: top-left, top-center, top-right, center-left, center,
#   center-right, bottom-left, bottom-center, bottom-right (default).
# Or use any place: position = { x = 0.75, y = 0.25 }, where x and y go from 0 (left, top)
#   to 1 (right, bottom). The Settings window lets you drag the popup to a place.
position = "bottom-right"

# If you do not answer, the popup skips the question after this number of seconds.
# The Skip button shows the countdown. The countdown stops while the pointer is on the popup.
# Use 0 to turn auto-skip off. Default: 30.
auto_skip_seconds = 30
