name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: jik.exe
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Test
      run: cargo test --verbose --workspace --release
    - name: Build
      run: cargo build --verbose --workspace --release
    - name: UI tests
      shell: pwsh
      run: ./tests/ui/run.ps1
    - uses: actions/upload-artifact@v4
      with:
        name: jik-${{ matrix.target }}
        path: target/release/${{ matrix.exe }}
        retention-days: 2
